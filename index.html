<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9e9e4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101113" media="(prefers-color-scheme: dark)">
<title>Atelier d'écriture</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atelier">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="styles.css">
<script type="module" src="src/app.js"></script>
</head>
<body>
<div class="app" id="app" data-view="ecrire" data-pane="items">

  <!-- Liste : recueil ou projet, avec ses éléments ou sa banque d'idées -->
  <section class="liste" id="listePane" aria-label="Projet">
    <div class="hero">
      <button class="projet" id="projectBtn" aria-label="Changer de projet"><span id="projectName"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="big" id="bigCount" aria-live="polite"></div>
      <div class="stats" id="totals"></div>
    </div>

    <div class="sheet">
      <div class="pane-items">
        <div class="cards" id="sceneList"></div>
      </div>
      <div class="pane-bank">
        <div class="bank-head">
          <h2 id="bankLabel">Bible de l'univers</h2>
          <button class="pill dark small" id="addEntry">+ Fiche</button>
        </div>
        <div class="filters" id="filters"></div>
        <div id="entries"></div>
        <p class="hint" id="bankHint"></p>
      </div>
    </div>

    <!-- Barre du bas : à portée du pouce -->
    <nav class="tabbar" aria-label="Navigation">
      <button class="tab" id="tabItems" data-pane="items" aria-current="page"><svg class="ic-song" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><svg class="ic-fiction" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 12h6M10 16h6"/></svg><span>Chansons</span></button>
      <button class="tab" id="tabBank" data-pane="bank" aria-current="false"><svg class="ic-song" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/></svg><svg class="ic-fiction" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2z"/><path d="M4 21a2 2 0 012-2h13v2H6"/></svg><span>Idées</span></button>
      <button class="fab" id="addBtn" aria-label="Nouvelle chanson"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="tab" id="projectsTab"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span>Projets</span></button>
      <div class="menu">
        <button class="tab" id="menuBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="menuPanel"><svg class="dots" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg><span>Plus</span></button>
        <div class="menu-panel" id="menuPanel" role="menu" hidden>
          <button role="menuitem" id="exportBtn">Copier le texte du projet</button>
          <button role="menuitem" id="zipBtn">Exporter en Markdown (.zip)</button>
          <button role="menuitem" id="backupBtn">Sauvegardes</button>
        </div>
      </div>
    </nav>
  </section>

  <!-- Écriture -->
  <section class="ecrire" id="ecrirePane" aria-label="Écriture">
    <div class="bar">
      <button class="round back" id="backBtn" aria-label="Retour à la liste">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span class="sp running" id="runningHead"></span>
      <button class="round" id="focusBtn" aria-label="Mode focus" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>

    <div class="ehead">
      <button class="eyebrow" id="eyebrow"></button>
      <div class="ehead-row">
        <textarea id="sceneTitle" rows="1" aria-label="Titre" placeholder="Titre"></textarea>
        <button class="facts" id="facts" aria-label="Réglages"></button>
      </div>
    </div>

    <div class="paper">
      <div class="paper-scroll" id="paperScroll">
      <div class="editor" id="editor">
        <div class="mirror" id="mirror" aria-hidden="true"></div>
        <textarea id="sceneText" aria-label="Texte" placeholder="Écris ici…"></textarea>
      </div>
      <div class="mentions-box" id="mentionsBox" hidden>
        <h3 id="mentionsLabel"></h3>
        <div class="chips" id="mentions"></div>
      </div>
      </div>
      <div class="accessory" id="accessory">
        <div class="song-only section-wrap">
          <button class="pill dark" id="sectionBtn" aria-haspopup="menu" aria-expanded="false">+ Section</button>
          <div class="section-menu" id="sectionMenu" role="menu" hidden></div>
        </div>
        <button class="pill song-only" id="analyseBtn" aria-pressed="true">Rimes</button>
        <div class="goal novel-only" id="goalBox">
          <div class="goal-row"><span id="goalText"></span><span id="pageNo"></span></div>
          <div class="goalbar" aria-hidden="true"><span id="goalFill"></span></div>
        </div>
        <span class="sp song-only"></span>
        <span class="status"><span id="wc">0 mot</span><span id="saved">Enregistré</span></span>
        <button class="round" id="settingsBtn" aria-label="Réglages">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
        </button>
      </div>
    </div>
  </section>
</div>

<!-- Réglages de l'élément en cours -->
<dialog id="settingsDlg" class="sheet-dlg" aria-labelledby="settingsTitle">
  <div class="dlg-head"><h2 id="settingsTitle">Réglages</h2><button class="pill dark small" id="settingsOk">OK</button></div>
  <div id="settingsBody"></div>
</dialog>

<!-- Projets -->
<dialog id="projectsDlg" class="sheet-dlg" aria-labelledby="projectsTitle">
  <div class="dlg-head"><h2 id="projectsTitle">Projets</h2><button class="pill dark small" id="projectsOk">OK</button></div>
  <label class="field"><span>Nom du projet en cours</span><input id="projectRename" autocomplete="off"></label>
  <div class="group"><span class="label">Univers du projet en cours</span><div class="seg" role="radiogroup" aria-label="Univers" id="projectKind"></div></div>
  <div class="project-list" id="projectList"></div>
  <div class="row-actions">
    <button class="pill" id="newSongs">+ Recueil de chansons</button>
    <button class="pill" id="newProject">+ Roman</button>
    <button class="pill" disabled title="Arrive avec l'éditeur de scénario">+ Film ou série · bientôt</button>
  </div>
</dialog>

<!-- Sauvegardes -->
<dialog id="backupDlg" class="sheet-dlg" aria-labelledby="backupTitle">
  <div class="dlg-head"><h2 id="backupTitle">Sauvegardes</h2><button class="pill dark small" id="closeDlg">Fermer</button></div>
  <p class="hint" id="storeInfo"></p>
  <div class="row-actions">
    <button class="pill" id="dlJson">Télécharger une copie</button>
    <label class="pill">Importer une copie<input type="file" id="importJson" accept=".json,application/json" hidden></label>
  </div>
  <h3>Copies automatiques</h3>
  <p class="hint">Une copie toutes les 10 minutes d'écriture, plus avant chaque restauration ou import. Les 30 plus récentes sont gardées.</p>
  <div id="backupList"></div>
</dialog>

<div class="toast" id="toast" hidden></div>
<div class="toast update" id="updateBar" hidden>Nouvelle version disponible <button class="pill small" id="updateBtn">Mettre à jour</button></div>
<noscript>Atelier a besoin de JavaScript.</noscript>
</body>
</html>
